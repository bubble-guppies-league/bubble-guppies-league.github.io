<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bubble Guppies League</title>
<link rel="icon" type="image/webp" href="logo.webp"><link rel="apple-touch-icon" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly league clubhouse — playful name, serious numbers.
   IDEA: an aquarium scoreboard: the league lives in a tank, results float up like bubbles.
   PICTURE: deep-water hero band with rising bubbles holding this week's live scoreboard.
   COLOUR and TYPE: deep sea teal, aqua support, coral accent; Fredoka titles, Barlow figures.
   LAYOUT: sticky tab bar, one view at a time, cards in wrapping grids, tables scroll on phones. */
:root{color-scheme:light dark;--bg:light-dark(#eef8f7,#03161d);--card:light-dark(#fff,#08262f);--ink:light-dark(#07303a,#e4f6f4);--mute:light-dark(#4d6d75,#8db2b7);--line:light-dark(#d2e7e5,#14404b);--soft:light-dark(#e3f3f1,#0c323d);--sea1:#0b5a6b;--sea2:#04303d;--aqua:#35d8c6;--coral:#ff6f5e;--win:light-dark(#08867a,#3fe2cd);--loss:light-dark(#d9483a,#ff7d6d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Fredoka,Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3.4vw,32px);margin-bottom:14px}h3{font-size:19px}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
.top{position:sticky;top:0;z-index:5;background:var(--sea2);color:#e8fbf9;box-shadow:0 2px 10px #0003}
.top .wrap{display:flex;align-items:center;gap:14px}
.brand{font:700 20px Fredoka,sans-serif;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:10px 0}
.brand img{width:30px;height:auto;filter:drop-shadow(0 1px 3px #0005)}
.herohead{display:flex;align-items:center;gap:clamp(12px,2.5vw,26px)}.herologo{width:clamp(78px,12vw,140px);height:auto;flex:none;filter:drop-shadow(0 8px 18px #0007)}
.clogo{width:clamp(110px,16vw,170px);height:auto;filter:drop-shadow(0 8px 16px #0004)}.champhead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.champ{text-align:center}.champ.latest{border:2px solid #f2b33d}.cyr{font:700 15px Fredoka,sans-serif;color:var(--mute)}.ctro{font-size:42px;line-height:1.1;margin:6px 0}.cmeta{display:grid;gap:8px;margin-top:12px;text-align:left;border-top:1px solid var(--line);padding-top:10px}.cmeta div{display:flex;flex-direction:column}
nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;flex:1}nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:#bfe9e4;text-decoration:none;padding:0 13px;min-height:48px;display:flex;align-items:center;font-weight:600;border-bottom:3px solid transparent}
nav a:hover{color:#fff}nav a.on{color:#fff;border-color:var(--aqua)}
nav a:focus-visible,.chip:focus-visible,.mc:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#147b8c 0%,var(--sea1) 40%,var(--sea2) 100%);color:#eafcfa;padding:clamp(26px,4vw,52px) 0 clamp(28px,4vw,48px)}
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:700;letter-spacing:-.5px}
.hero .sub{color:#b7e6e1;margin:8px 0 22px;font-size:17px}
.bub{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff9 0 12%,#9ff5ec33 30%,#5fe0d322 70%);border:1px solid #bff7f155;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}
@media(prefers-reduced-motion:reduce){.bub{animation:none;display:none}}
.hero .wrap{position:relative}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.mc{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;cursor:pointer;backdrop-filter:blur(4px);text-align:left;width:100%}
.mc:hover{background:#ffffff1a}
.side{display:flex;align-items:center;gap:10px;padding:4px 0}
.side .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .rec{font-size:13px;opacity:.7;white-space:nowrap}
.side .sc{font:700 26px Fredoka,sans-serif;width:30px;text-align:right}
.side.lead .sc{color:var(--aqua)}
.pips{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}
.pip{font-size:11px;text-align:center;border-radius:6px;padding:3px 0;background:#ffffff14;color:#cfeeea}
.pip.h{background:#35d8c655;color:#fff}.pip.a{background:#ff6f5e55;color:#fff}
.av{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px Fredoka,sans-serif;color:#fff;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.av.lg{width:64px;height:64px;font-size:22px}
main{padding:clamp(24px,3.5vw,44px) 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack2>*+*{margin-top:18px}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,.tl{text-align:left}
tr.cut td{border-bottom:2px dashed var(--coral)}
.tn{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.tn .av{width:28px;height:28px;font-size:11px}
.mute{color:var(--mute)}.small{font-size:13px}
.w{color:var(--win);font-weight:700}.l{color:var(--loss);font-weight:700}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--sea1);border-color:var(--sea1);color:#fff}
.mx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;align-items:center}
.mx .c{font-size:13px;color:var(--mute);text-align:center;width:44px}
.mx .v{font-weight:600}.mx .v.r{text-align:right}
.mx .v.win{color:var(--win)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead .n{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis}
.big{font:700 30px Fredoka,sans-serif}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sea1),var(--aqua))}
.brow{display:grid;grid-template-columns:48px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.res{width:44px;border-radius:10px;padding:5px 0;text-align:center;font-size:12px;background:var(--soft)}
.res b{display:block;font:700 16px Fredoka,sans-serif}
.res.W b{color:var(--win)}.res.L b{color:var(--loss)}.res.live{outline:2px dashed var(--aqua)}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.add{background:light-dark(#d6f5f0,#0f4a45);color:var(--win)}.tag.drop{background:light-dark(#fde3df,#4a1c18);color:var(--loss)}.tag.trade{background:var(--coral);color:#fff}
.inj{font-size:11px;font-weight:700;color:#fff;background:var(--coral);border-radius:5px;padding:1px 5px;margin-left:6px}
.stat{display:flex;flex-direction:column}.stat b{font:700 28px Fredoka,sans-serif}.stat span{font-size:13px;color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:22px 34px;margin-top:14px}
.rec h3{margin-bottom:6px}.rec .big{color:var(--sea1)}
:root:not([data-theme=light]) .rec .big{color:light-dark(var(--sea1),var(--aqua))}
.heat td.h{border-radius:0}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.trophy{display:grid;place-items:center;gap:10px;padding:34px 16px;text-align:center}
.trophy svg{width:120px;height:120px}
.tbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.seg button{border:0;background:none;border-radius:999px;min-height:40px;padding:0 16px;font-weight:700;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--sea1);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;min-height:44px}.chk input{width:20px;height:20px;accent-color:var(--sea1)}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
select{font:600 16px Barlow,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:18px}
.grid2:first-child{margin-top:0}
.plist{margin-top:10px;max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;cursor:pointer;min-height:52px}
.pl.on{border-color:var(--aqua);background:color-mix(in srgb,var(--aqua) 16%,var(--card))}
.pl .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.pl.on .box{background:var(--sea1);border-color:var(--sea1)}
.pn{flex:1;display:flex;flex-direction:column}
.verdict{margin-top:18px}
.cw{flex-direction:column;gap:0;min-width:64px;justify-content:center}.cw .small{font-size:11px;line-height:1}
.cw.t{background:var(--sea1);border-color:var(--sea1);color:#fff}.cw.p{opacity:.55;text-decoration:line-through}
.idea .deal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.idea .deal div{display:flex;flex-direction:column}
.tchgs{display:flex;flex-wrap:wrap;gap:6px}.tchg{font-size:13px;background:var(--soft);border-radius:8px;padding:2px 8px}
.ideabot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.filters{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr)}
@media(max-width:700px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .lab:first-child{grid-column:1/-1}}
input[type=search]{font:500 16px Barlow,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.sortb{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:6px 2px;min-height:36px}.sortb.on{color:var(--ink)}
.ptab td:first-child{display:flex;align-items:center;gap:10px;white-space:normal;min-width:210px}
.pcell{display:flex;flex-direction:column}
.pick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.pick.on{background:var(--sea1);border-color:var(--sea1);color:#fff}
tr.sel td{background:color-mix(in srgb,var(--aqua) 10%,transparent)}
.linkb{border:0;background:none;color:var(--win);font:inherit;font-weight:700;cursor:pointer;padding:4px;text-decoration:underline}
.cmph{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:normal}
td.best{color:var(--win);font-weight:800;background:color-mix(in srgb,var(--aqua) 14%,transparent)}
.vsrow{display:flex;align-items:center;justify-content:center;gap:22px}.vsc{text-align:center}
.cbbar{display:flex;flex-wrap:wrap;gap:8px 12px;margin:10px 0 8px}.seg.sm button{min-height:36px;padding:0 12px;font-size:14px}
.hstrip{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 10px;scroll-snap-type:x mandatory}
.pcard.dual{flex-basis:min(380px,90vw)}.pcard{flex:0 0 min(330px,86vw);scroll-snap-align:start}.pcard.mine{border:2px solid var(--aqua)}
.pw2{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}.pw2 b{font:700 20px Fredoka,sans-serif}
.ptbl td,.ptbl th{padding:6px 4px;font-size:14px}.pcard h4{margin:14px 0 6px;font-size:15px}
.rl{list-style:none;margin:0;padding:0;columns:2;column-gap:12px;font-size:14px}.rl li{padding:3px 0;break-inside:avoid}.rl .in{color:var(--win);font-weight:700}.rl .out{color:var(--loss);text-decoration:line-through}
.dealrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.dealrow span{flex:1;min-width:200px}
.planban{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;border-color:var(--aqua)}
footer{padding:24px 0 40px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:600px){table{font-size:13px}td,th{padding:8px 4px}.brand span{display:none}.hero .sub{font-size:15px}}
.reef{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:26px clamp(12px,3vw,30px) 90px;color:#e8fdff;background:linear-gradient(180deg,#0e86a3 0%,#0a5f80 30%,#07405f 62%,#052a42 100%);box-shadow:0 18px 40px #0005}
.reef h2{margin:0;color:#fff;font:700 clamp(24px,4vw,34px) Fredoka,sans-serif;text-shadow:0 2px 10px #0006}
.reef p{margin:6px 0 0;color:#c9f4fb;max-width:60ch}
.reefhead{position:relative;z-index:3;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.reefhead .clogo{width:clamp(90px,13vw,130px)}
.ray{position:absolute;top:-30%;height:160%;width:18%;z-index:0;pointer-events:none;background:linear-gradient(180deg,#e6fdff55,#e6fdff00 75%);filter:blur(8px);transform-origin:top;animation:raysw 10s ease-in-out infinite alternate}
.ray.r1{left:8%;transform:rotate(16deg)}.ray.r2{left:42%;width:12%;animation-duration:13s;opacity:.7;transform:rotate(9deg)}.ray.r3{left:72%;width:20%;animation-duration:15s;opacity:.55;transform:rotate(-6deg)}
@keyframes raysw{from{translate:-4% 0;opacity:.35}to{translate:5% 0;opacity:.8}}
.caus{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.18;background:radial-gradient(ellipse 60px 22px at 20% 30%,#fff 0,transparent 70%),radial-gradient(ellipse 80px 26px at 70% 18%,#fff 0,transparent 70%),radial-gradient(ellipse 50px 18px at 45% 55%,#fff 0,transparent 70%),radial-gradient(ellipse 70px 20px at 85% 62%,#fff 0,transparent 70%);background-size:340px 260px;animation:caus 14s linear infinite;mix-blend-mode:soft-light}
@keyframes caus{to{background-position:340px 120px,-340px 260px,170px -260px,-170px 130px}}
.reef .bub{z-index:1}
.sand{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1;background:radial-gradient(120% 60px at 50% 0,transparent 60%,#0000 61%),linear-gradient(180deg,#d9c48a,#b79a5c);border-top-left-radius:50% 26px;border-top-right-radius:50% 26px;box-shadow:inset 0 8px 14px #0003}
.weed{position:absolute;bottom:40px;z-index:2;width:60px;transform-origin:bottom center;animation:weed 5s ease-in-out infinite alternate}
.weed.wl{left:1%;height:160px}.weed.wr{right:1%;height:130px;animation-duration:6.5s}
@keyframes weed{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
.fish{position:absolute;top:22%;left:-80px;width:46px;z-index:1;opacity:.9;animation:swim 30s linear infinite}
@keyframes swim{0%{transform:translate(0,0) scaleX(-1)}25%{transform:translate(30vw,20px) scaleX(-1)}50%{transform:translate(60vw,-10px) scaleX(-1)}100%{transform:translate(calc(100vw + 160px),30px) scaleX(-1)}}
.mgrs{position:relative;z-index:3;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:22px}
.mgr{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#ffffff14;border:1px solid #c8f7ff40;backdrop-filter:blur(4px)}
.mgr.goat{background:linear-gradient(135deg,#ffe29a33,#ffffff10);border-color:#ffd97a88}
.mrank{font:700 20px Fredoka,sans-serif;min-width:28px;text-align:center}
.mgr b{color:#fff}.mx{font:700 18px Fredoka,sans-serif;color:#ffd76a}
.mcups{display:flex;gap:3px;margin:3px 0}.mcups i{width:12px;height:15px;background:linear-gradient(#fff1a8,#c98a1c);clip-path:polygon(0 0,100% 0,85% 45%,60% 60%,60% 78%,80% 78%,80% 100%,20% 100%,20% 78%,40% 78%,40% 60%,15% 45%)}
.msub{font-size:12px;color:#bfeaf2}
.cab{position:relative;z-index:3;max-width:820px;margin:0 auto;padding:0 clamp(8px,2vw,18px) 10px;border-radius:20px 20px 8px 8px;background:linear-gradient(120deg,#ffffff26,#ffffff06 38%,#ffffff12 60%,#ffffff04);border:2px solid #dffcff70;box-shadow:inset 0 0 0 7px #ffffff0c,inset 0 0 60px #9ff5ec26,0 26px 50px #0009;backdrop-filter:blur(2px) saturate(1.2)}
.cab::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ffffff2e 34%,transparent 40%,transparent 62%,#ffffff1a 65%,transparent 69%)}
.cabtop{display:flex;flex-direction:column;align-items:center;margin:0 auto 4px;padding:8px 26px 10px;width:max-content;max-width:90%;border-radius:0 0 14px 14px;background:linear-gradient(#f6e3a6,#b8913f);color:#3a2a08;box-shadow:0 4px 10px #0006,inset 0 1px #fff9;text-align:center}
.cabtop span{font:600 11px Fredoka,sans-serif;letter-spacing:.2em;text-transform:uppercase}.cabtop b{font:700 clamp(16px,2.6vw,20px) Fredoka,sans-serif}
.shelf{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:clamp(6px,3vw,34px);padding:18px 4px 14px}
.shelf::after{content:"";position:absolute;left:-2px;right:-2px;bottom:0;height:10px;border-radius:3px;background:linear-gradient(180deg,#eaffff99,#9fe9f04d 40%,#5fc3d233);box-shadow:0 6px 12px #0006,inset 0 1px #fff}
.tro{position:relative;margin:0;width:clamp(92px,24vw,170px);text-align:center;transition:transform .35s cubic-bezier(.2,.8,.2,1);outline:none}
.cupw{position:relative;width:72%;margin:0 auto;filter:drop-shadow(0 8px 8px #0008)}
.cupw svg{display:block;width:100%;height:auto}
.cupw::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff9 48%,transparent 60%);mix-blend-mode:overlay;opacity:0;transform:translateX(-120%);transition:transform .8s,opacity .3s}
.tro:hover,.tro:focus{transform:translateY(-6px)}.tro:hover .cupw::after,.tro:focus .cupw::after{opacity:1;transform:translateX(120%)}
.tro.latest .cupw{filter:drop-shadow(0 0 16px #ffd76acc) drop-shadow(0 8px 8px #0008);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 26px #ffe9a0) drop-shadow(0 8px 8px #0008)}}
.plate{margin:6px auto 0;max-width:100%;padding:5px 7px;border-radius:5px;background:linear-gradient(#f6e3a6,#b8913f);color:#3a2a08;box-shadow:inset 0 1px #fffa,0 3px 6px #0007;font:600 10px/1.2 Fredoka,sans-serif}
.plate b{display:block;font-size:clamp(11px,1.6vw,13px);overflow-wrap:anywhere}.pyr{letter-spacing:.08em}
.who{margin-top:5px;font-size:12px;color:#d9fbff}
.tip{position:absolute;left:50%;bottom:100%;translate:-50% 0;z-index:5;width:max-content;max-width:220px;padding:7px 10px;border-radius:10px;background:#03202fe8;color:#e8fdff;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.tro:hover .tip,.tro:focus .tip{opacity:1}
.cabfoot{height:16px;margin:0 -2px;border-radius:0 0 6px 6px;background:linear-gradient(#b8913f,#7a5a1e)}
@media(prefers-reduced-motion:reduce){.reef *,.reef *::after{animation:none!important;transition:none!important}.fish{display:none}}

.dnagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.dna .dnahead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dnabody{display:flex;gap:12px;align-items:center}.radar{flex:none;color:var(--ink,#123);max-width:100%;height:auto}
.dnafacts{display:grid;gap:7px;min-width:0}.dnafacts>div{display:flex;flex-direction:column}
.dnastats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dnastats div{display:flex;flex-direction:column;align-items:center;text-align:center}.dnastats b{font:700 16px Fredoka,sans-serif}.dnastats span{font-size:11px;color:var(--mute)}
.dnacmp{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px}.dnacmp .radar{width:min(300px,100%)}
.dbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;margin:5px 0;font-size:13px}
.dbar .dc{text-align:center;font-weight:600}.dbar .dl{color:var(--mute)}.dbar .dl.r{text-align:right}
.dtrack{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--line)}.dtrack i{position:absolute;top:0;height:100%;border-radius:3px}
.heatt td.heat{font-weight:700;color:#1d2b2a;text-align:center;min-width:34px}
@media(max-width:560px){.dnabody{flex-direction:column;align-items:stretch}.dnabody .radar{margin:0 auto}.dnagrid{grid-template-columns:1fr}}

.obar{position:relative;height:22px;min-width:92px;border-radius:6px;background:var(--line);overflow:hidden}
.obar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;opacity:.85}
.obar span{position:relative;display:block;text-align:center;font:600 12px/22px Fredoka,sans-serif}
.oddst td.oc{min-width:96px}.seedt td.sd{text-align:center;font-weight:600;min-width:30px}.seedt td.sdcut{border-right:2px dashed var(--mute)}
.omini{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;margin:6px 0}
.omini .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tnn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.tn{min-width:0}
.scroll tr>td.tl:first-child,.scroll tr>th.tl:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
nav{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
@media(max-width:600px){
 .hero{padding:16px 0 18px}.hero h1{font-size:34px}.herologo{width:64px}.hero .sub{margin:4px 0 12px;font-size:13px}
 #board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -14px;padding:0 14px 6px;scrollbar-width:none}#board::-webkit-scrollbar{display:none}
 #board .mc{flex:0 0 84%;scroll-snap-align:center;padding:11px}
 .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-14px;margin-right:-14px;padding:0 14px 4px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;min-height:40px;padding:0 13px}
 .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{white-space:nowrap;font-size:13px;padding:0 11px;min-height:36px;flex:none}
 .scroll .tn{max-width:136px}.scroll .tn .av{width:22px;height:22px;font-size:9px}
 .card{padding:14px}h2{font-size:22px}
 .hide-sm{display:none}
 .obar{min-width:50px}.oddst td.oc{min-width:52px}.oddst tr>:first-child{display:none}.oddst .tn{max-width:104px}footer,footer *{white-space:normal!important}
 .dnastats{grid-template-columns:repeat(2,1fr)}
}
</style></head><body>
<header class="top"><div class="wrap">
<div class="brand"><img src="logo.webp" alt="" width="30" height="35"><span>Bubble Guppies</span></div>
<nav id="nav"><a href="#home">Home</a><a href="#standings">Standings</a><a href="#odds">Odds</a><a href="#matchups">Matchups</a><a href="#teams">Teams</a><a href="#dna">DNA</a><a href="#players">Players</a><a href="#trades">Trades</a><a href="#moves">Moves</a><a href="#records">Records</a><a href="#champions">Champions</a></nav>
</div></header>
<section class="hero" id="hero"><div class="wrap">
<div class="herohead"><img class="herologo" src="logo.webp" alt="Bubble Guppies Fantasy League logo"><div><h1>Bubble Guppies</h1>
<p class="sub" id="sub">Loading the tank…</p></div></div>
<div class="grid" id="board"></div>
</div></section>
<main><div class="wrap" id="app"></div></main>
<footer id="foot">Bubble Guppies · ESPN fantasy basketball · 9-category head-to-head</footer>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=t=>esc(String(t??'').trim());
const LOW={TO:1},PCT={'FG%':1,'FT%':1};
const fmt=(c,v,d=0)=>v==null?'–':PCT[c]?(+v).toFixed(3).replace(/^0/,''):(+v).toFixed(d);
const pct=x=>isFinite(x)?x.toFixed(3).replace(/^0/,''):'–';
const HUES=[174,8,200,32,150,280,215,340,95,45,255,190];
let D,H=[],CATS,T,ST,G={},WK={},AP={},AV={},RK={},PW=[],PWR={},W,DONE=[],team=null,wsel=null,mf='all';
const hash=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
const av=(t,cls='')=>{const s=ST[t]||{};const ini=String(t).trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="av ${cls}" style="background:hsl(${HUES[Math.abs(hash(t))%HUES.length]} 55% 38%)">${esc(ini)}${(s.logo_data||s.logo)?`<img src="${esc(s.logo_data||s.logo)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`};
const rec=t=>{const s=ST[t];return s?`${s.wins}-${s.losses}${s.ties?'-'+s.ties:''}`:''};
const tlink=t=>`<span class="tn" data-team="${esc(t)}">${av(t)}<span class="tnn">${nm(t)}</span></span>`;
function vs(a,b){let w=0,l=0,t=0;for(const c of CATS){const x=a[c],y=b[c];if(x==null||y==null)continue;if(x===y)t++;else if(LOW[c]?x<y:x>y)w++;else l++}return{w,l,t}}

function build(){
  CATS=D.cats;W=D.week;T=D.standings.map(s=>s.team);ST=Object.fromEntries(D.standings.map(s=>[s.team,s]));
  T.forEach(t=>{G[t]=[];AP[t]={w:0,l:0,t:0,cw:0,cl:0,ct:0}});
  for(const m of D.matchups){
    for(const [me,op,s,o] of [[m.home,m.away,'home','away'],[m.away,m.home,'away','home']]){
      const st={},os={};for(const c of CATS){st[c]=m.cats?.[c]?.[s];os[c]=m.cats?.[c]?.[o]}
      const r=vs(st,os);G[me]?.push({week:m.week,opp:op,cw:r.w,cl:r.l,ct:r.t,res:r.w>r.l?'W':r.w<r.l?'L':'T',st,done:m.week<W});
      (WK[m.week]??={})[me]=st;
    }
  }
  DONE=Object.keys(WK).map(Number).filter(w=>w<W).sort((a,b)=>a-b);
  const use=DONE.length?DONE:Object.keys(WK).map(Number);
  for(const w of DONE){const ts=Object.keys(WK[w]);for(const a of ts)for(const b of ts){if(a===b)continue;const r=vs(WK[w][a],WK[w][b]);AP[a].cw+=r.w;AP[a].cl+=r.l;AP[a].ct+=r.t;if(r.w>r.l)AP[a].w++;else if(r.w<r.l)AP[a].l++;else AP[a].t++}}
  for(const t of T){AV[t]={};for(const c of CATS){const v=use.map(w=>WK[w]?.[t]?.[c]).filter(x=>x!=null);AV[t][c]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}
  for(const c of CATS){const o=[...T].sort((a,b)=>LOW[c]?AV[a][c]-AV[b][c]:AV[b][c]-AV[a][c]);o.forEach((t,i)=>{(RK[t]??={})[c]=i+1})}
  PW=T.map(t=>{const g=G[t].filter(x=>x.done);let cw=0,cl=0,ct=0;g.forEach(x=>{cw+=x.cw;cl+=x.cl;ct+=x.ct});const a=AP[t];const apn=a.w+a.l+a.t,apP=apn?(a.w+a.t/2)/apn:0;const cn=cw+cl+ct,cP=cn?(cw+ct/2)/cn:0;const s=ST[t],n=s.wins+s.losses+s.ties,wP=n?(s.wins+s.ties/2)/n:0;
    let streak='';for(let i=g.length-1;i>=0;i--){if(!streak)streak=g[i].res+'1';else if(g[i].res===streak[0])streak=streak[0]+(+streak.slice(1)+1);else break}
    return{t,cw,cl,ct,cP,apP,wP,luck:wP-apP,streak,score:.5*apP+.3*cP+.2*wP}}).sort((a,b)=>b.score-a.score);
  PW.forEach((p,i)=>{p.rank=i+1;PWR[p.t]=p});
}

const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const weekGames=w=>D.matchups.filter(m=>m.week===w);

function hero(){
  const reg=D.settings?.reg_season_weeks||17;
  $('#sub').textContent=`2026–27 season · Week ${W} of ${reg} · ${T.length} teams · updated ${ago(D.updated)}`;
  $('#board').innerHTML=weekGames(W).map(m=>{const h=vs(cat(m,'home'),cat(m,'away'));
    const pips=CATS.map(c=>{const r=vs({[c]:m.cats?.[c]?.home},{[c]:m.cats?.[c]?.away});return `<span class="pip ${r.w?'h':r.l?'a':''}">${esc(c)}</span>`}).join('');
    return `<button class="mc" data-week="${m.week}"><div class="side ${h.w>h.l?'lead':''}">${av(m.home)}<span class="n">${nm(m.home)}</span><span class="rec">${rec(m.home)}</span><span class="sc">${h.w}</span></div><div class="side ${h.l>h.w?'lead':''}">${av(m.away)}<span class="n">${nm(m.away)}</span><span class="rec">${rec(m.away)}</span><span class="sc">${h.l}</span></div><div class="pips">${pips}</div></button>`}).join('');
  const hr=$('#hero');for(let i=0;i<14;i++){const b=document.createElement('span');const s=6+Math.random()*22;b.className='bub';b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*20}s`;hr.prepend(b)}
}
const cat=(m,s)=>Object.fromEntries(CATS.map(c=>[c,m.cats?.[c]?.[s]]));

function standTable(full){
  const po=D.settings?.playoff_teams||6;
  const rows=D.standings.map((s,i)=>{const p=PWR[s.team],a=AP[s.team];const n=s.wins+s.losses+s.ties;
    return `<tr class="${i===po-1?'cut':''}"><td>${s.rank??i+1}</td><td class="tl">${tlink(s.team)}</td><td>${rec(s.team)}</td><td>${pct(n?(s.wins+s.ties/2)/n:NaN)}</td>${full?`<td>${p.cw}-${p.cl}-${p.ct}</td><td>${pct(p.cP)}</td><td>${a.w}-${a.l}${a.t?'-'+a.t:''}</td><td class="${p.luck>.05?'w':p.luck<-.05?'l':''}">${(p.luck>0?'+':'')+p.luck.toFixed(2)}</td><td>${p.streak||'–'}</td>`:''}<td>${p.rank}</td></tr>`}).join('');
  return `<div class="scroll"><table><thead><tr><th>#</th><th class="tl">Team</th><th>W-L-T</th><th>Pct</th>${full?'<th>Cats</th><th>Cat %</th><th>All-play</th><th>Luck</th><th>Streak</th>':''}<th>Power</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small mute">Dashed line: playoff cut (top ${po}). Power = category placement points (10 for 1st, 1 for last) based on ${CB==='roster'?'current rosters':'finished weeks'}; switch it under Category strength.${full?' All-play: your weekly categories against every team, not just your opponent. Luck: real win % minus all-play win %.':''}</p>`;
}

function feed(list,n){
  return `<ul class="feed">${list.slice(0,n).map(x=>{const a=x.action;const k=/TRADE/.test(a)?'trade':/DROP/.test(a)?'drop':'add';const d=new Date(x.date);
    return `<li><span class="tag ${k}">${k==='add'?(/WAIVER/.test(a)?'Waiver':'Add'):k==='drop'?'Drop':'Trade'}</span><span style="flex:1"><b>${esc(x.player)}</b> <span class="mute small">· ${nm(x.team)}</span></span><span class="small mute" style="white-space:nowrap">${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></li>`}).join('')||'<li class="mute">No moves yet.</li>'}</ul>`;
}

const V={
home(){
  const top=PW.slice(0,3).map(p=>`<div class="brow"><b class="big" style="font-size:22px">${p.rank}</b>${tlink(p.t)}<span class="small mute" style="text-align:right">${p.pts} pts</span></div>`).join('');
  return `<div class="cols"><div class="card"><h2>Standings</h2>${standTable(false)}</div><div class="stack2"><div class="card"><h2>Power top 3</h2>${cbBar()}${top}<p class="small mute">Points for where a team places in each category (10 for 1st, 1 for last), added up across all 9. Based on ${CB==='roster'?'current rosters':'finished weeks'}, same as the War Room.</p></div><div class="card"><h2>Playoff chances</h2>${oddsMini()}</div><div class="card"><h2>Latest moves</h2>${feed(D.log||[],8)}</div></div></div>`},
standings(){
  const K=catBasis();const heat=T.map(t=>`<tr><td class="tl">${tlink(t)}</td>${CATS.map(c=>{const r=K.r(t,c);const a=(T.length-r)/(T.length-1);return `<td style="background:color-mix(in srgb,var(--aqua) ${Math.round(a*55)}%,transparent)">${K.v(t,c)}<span class="small mute"> ${r}</span></td>`}).join('')}</tr>`).join('');
  return `<div class="card"><h2>League table</h2>${standTable(true)}</div><div class="card" style="margin-top:18px"><h2>Category strength</h2>${cbBar()}<p class="small mute">${CB==='roster'?K.note:`Average weekly totals${DONE.length?` over ${DONE.length} completed weeks`:''}`}; small number is league rank, darker is better.</p><div class="scroll"><table class="heat"><thead><tr><th class="tl">Team</th>${CATS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${heat}</tbody></table></div></div>`},
matchups(){
  const w=wsel??W;const weeks=[...new Set(D.matchups.map(m=>m.week))].sort((a,b)=>a-b);
  const chips=weeks.map(x=>`<button class="chip ${x===w?'on':''}" data-wk="${x}">Week ${x}${x===W?' · live':''}</button>`).join('');
  const cards=weekGames(w).map(m=>{const hs=cat(m,'home'),as=cat(m,'away'),r=vs(hs,as);
    const rows=CATS.map(c=>{const x=vs({[c]:hs[c]},{[c]:as[c]});return `<span class="v ${x.w?'win':''}">${fmt(c,hs[c])}</span><span class="c">${esc(c)}</span><span class="v r ${x.l?'win':''}">${fmt(c,as[c])}</span>`}).join('');
    return `<div class="card"><div class="mhead">${av(m.home)}<span class="n">${nm(m.home)}</span><span class="big ${r.w>r.l?'w':''}">${r.w}</span></div><div class="mhead">${av(m.away)}<span class="n">${nm(m.away)}</span><span class="big ${r.l>r.w?'w':''}">${r.l}</span></div><div class="mx">${rows}</div>${r.t?`<p class="small mute">${r.t} tied ${r.t>1?'categories':'category'}</p>`:''}</div>`}).join('');
  return `<h2>Week ${w}${w===W?' (in progress)':''}</h2><div class="chips">${chips}</div><div class="grid">${cards}</div>`},
teams(){
  const t=team&&ST[team]?team:D.standings[0].team;const p=PWR[t],s=ST[t];
  const chips=T.map(x=>`<button class="chip ${x===t?'on':''}" data-pick="${esc(x)}">${nm(x)}</button>`).join('');
  const K=catBasis();const bars=CATS.map(c=>{const r=K.r(t,c);return `<div class="brow"><b>${esc(c)}</b><div class="bar"><i style="width:${Math.round((T.length+1-r)/T.length*100)}%"></i></div><span class="small" style="text-align:right">${ord(r)} · ${K.v(t,c)}</span></div>`}).join('');
  const res=G[t].map(g=>`<div class="res ${g.res} ${g.done?'':'live'}" title="vs ${esc(String(g.opp).trim())}"><b>${g.done?g.res:'•'}</b>${g.cw}-${g.cl}</div>`).join('');
  const reg=D.settings?.reg_season_weeks||17,sch=(D.schedule?.[t]||[]).map((o,i)=>({w:i+1,o})).filter(x=>x.w>W&&x.w<=reg);
  const sos=sch.length?sch.reduce((a,x)=>a+(PWR[x.o]?.rank||0),0)/sch.length:null;
  const SO=['PG','SG','G','SF','PF','F','C','UT','BE','IR'];
  const ros=[...(D.rosters?.[t]||[])].sort((a,b)=>(SO.indexOf(a.slot)+99)%99-(SO.indexOf(b.slot)+99)%99);
  const rrows=ros.map(r=>{const a=Object.keys(r.avg||{}).length>1?r.avg:r.proj||{};return `<tr><td class="tl"><b>${esc(r.name)}</b>${r.injury&&r.injury!=='ACTIVE'?`<span class="inj">${esc(r.injury.replace('DAY_TO_DAY','DTD'))}</span>`:''}<div class="small mute">${esc(r.team)} · ${esc((r.elig||[]).join('/')||r.pos)}</div></td><td>${esc(r.slot)}</td>${CATS.map(c=>`<td>${fmt(c,a[c],1)}</td>`).join('')}</tr>`}).join('');
  const moves=(D.log||[]).filter(x=>x.team===t);
  return `<div class="chips">${chips}</div>
  <div class="card"><div class="mhead">${av(t,'lg')}<div style="flex:1"><h2 style="margin:0">${nm(t)}</h2><div class="mute">${ord(s.rank)} place · power #${p.rank}</div></div></div>
  <div class="stats"><div class="stat"><b>${rec(t)}</b><span>record</span></div><div class="stat"><b>${p.cw}-${p.cl}-${p.ct}</b><span>categories</span></div><div class="stat"><b>${AP[t].w}-${AP[t].l}</b><span>all-play</span></div><div class="stat"><b>${p.streak||'–'}</b><span>streak</span></div><div class="stat"><b>${moves.length}</b><span>moves logged</span></div></div></div>
  <div class="cols" style="margin-top:18px"><div class="card"><h3>Category ranks</h3>${cbBar()}<p class="small mute" style="margin:0 0 6px">${K.note}</p>${bars}</div><div class="stack2"><div class="card"><h3 style="margin-bottom:10px">Results</h3><div class="strip">${res}</div><p class="small mute">Category score each week; dashed is this week, live.</p></div><div class="card"><h3>Remaining schedule</h3><p class="small mute">Avg opponent power rank: ${sos?sos.toFixed(1):'–'} (1 is hardest)</p><div class="strip">${sch.map(x=>`<span class="chip" style="min-height:36px;cursor:default">W${x.w} ${nm(x.o)} <span class="mute small">#${PWR[x.o]?.rank??'–'}</span></span>`).join('')}</div></div></div></div>
  <div class="card" style="margin-top:18px"><h3>Roster</h3><p class="small mute">Per-game averages, recent form where ESPN has it, otherwise projections.</p><div class="scroll"><table><thead><tr><th class="tl">Player</th><th>Slot</th>${CATS.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rrows}</tbody></table></div></div>
  <div class="card" style="margin-top:18px"><h3>Moves</h3>${feed(moves,15)}</div>`},
moves(){
  const L=D.log||[];const cnt=T.map(t=>{const x=L.filter(y=>y.team===t);return{t,add:x.filter(y=>/ADD/.test(y.action)).length,drop:x.filter(y=>/DROP/.test(y.action)).length,trade:x.filter(y=>/TRADE/.test(y.action)).length}}).sort((a,b)=>(b.add+b.trade)-(a.add+a.trade));
  const mx=Math.max(1,...cnt.map(c=>c.add));
  const list=mf==='all'?L:mf==='trades'?L.filter(x=>/TRADE/.test(x.action)):L.filter(x=>x.team===mf);
  return `<div class="cols"><div class="card"><h2>Transaction wire</h2><div class="chips"><button class="chip ${mf==='all'?'on':''}" data-mf="all">All</button><button class="chip ${mf==='trades'?'on':''}" data-mf="trades">Trades</button>${T.map(t=>`<button class="chip ${mf===t?'on':''}" data-mf="${esc(t)}">${nm(t)}</button>`).join('')}</div>${feed(list,60)}<p class="small mute">${list.length} entries${list.length>60?', showing latest 60':''}.</p></div>
  <div class="card"><h2>Most active</h2>${cnt.map(c=>`<div class="brow" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 64px">${tlink(c.t)}<div class="bar"><i style="width:${c.add/mx*100}%"></i></div><span class="small" style="text-align:right">${c.add} adds${c.trade?` · ${c.trade}T`:''}</span></div>`).join('')}</div></div>`},
records(){
  const all=T.flatMap(t=>G[t].filter(g=>g.done).map(g=>({...g,t})));
  if(!all.length)return `<div class="card empty">Records start after week 1 finishes.</div>`;
  const best=CATS.map(c=>{const v=all.filter(g=>g.st[c]!=null).sort((a,b)=>LOW[c]?a.st[c]-b.st[c]:b.st[c]-a.st[c])[0];return `<div class="card rec"><span class="mute small">${LOW[c]?'Fewest':PCT[c]?'Best':'Most'} ${esc(c)} in a week</span><div class="big">${fmt(c,v.st[c])}</div>${tlink(v.t)}<div class="small mute" style="margin-top:4px">Week ${v.week} vs ${nm(v.opp)}</div></div>`}).join('');
  const blow=[...all].sort((a,b)=>(b.cw-b.cl)-(a.cw-a.cl))[0];

};
// ===== Trades =====
const TS={sub:'analyze',mode:'proj',inj:false,deals:[],planAll:false,a:null,b:null,ga:[],gb:[],me:null,w:{},plan:[],res:null};
try{Object.assign(TS,JSON.parse(localStorage.getItem('bg-trade2')||'{}'));TS.res=null}catch(e){}
const tsave=()=>{try{const {res,...k}=TS;localStorage.setItem('bg-trade2',JSON.stringify(k))}catch(e){}};
const EXTRA=['FGM','FGA','FTM','FTA'];
const has=o=>o&&Object.keys(o).some(k=>CATS.includes(k));
const seasonReady=()=>Object.values(D.rosters||{}).some(r=>r.some(p=>has(p.season)));
const prj=p=>has(p.proj)?p.proj:has(p.avg)?p.avg:{};
const sea=p=>(has(p.season)&&(+p.season.GP||0)>=3)?p.season:prj(p);
const std=p=>pst(p);
function pst(p){if(TS.mode==='season')return sea(p);if(TS.mode==='recent')return has(p.avg)?p.avg:prj(p);return prj(p)}
if(!TS.v3){TS.mode='proj';TS.v3=1}
const hurt=p=>p.slot==='IR'||p.injury==='OUT';
let WORLD=null;const rosterOf=t=>((WORLD&&WORLD[t])||D.rosters?.[t]||[]);
const counted=ps=>TS.inj?ps:ps.filter(p=>!hurt(p));
const GPW=3.5;
function lineS(S){const o={};S=S.filter(s=>s&&s.PTS!=null);for(const c of CATS){const xs=S.map(s=>s[c]).filter(x=>x!=null).map(Number);o[c]=xs.length?(PCT[c]?xs.reduce((a,x)=>a+(x>1?x/100:x),0)/xs.length:xs.reduce((a,b)=>a+b,0)/xs.length*10*GPW):null}return o}
function line(ps){return lineS(ps.map(pst))}
function settle(ps,n,V,keep){ps=[...ps];const dr=[],ad=[];while(ps.length<n){const f=FAP.find(p=>!ps.some(q=>q.name===p.name));if(!f)break;ps.push(f);ad.push(f.name)}while(ps.length>n){let i=-1,lo=1e9;ps.forEach((p,j)=>{if(keep.has(p.name))return;const v=V[p.name]??0;if(v<lo){lo=v;i=j}});if(i<0)break;dr.push(ps[i].name);ps.splice(i,1)}return{ps,dr,ad}}
let DROPS={};
function lines(sw,V){const L={};DROPS={};for(const t of T){let ps=rosterOf(t);const n0=ps.length;
  if(sw&&t===sw.a)ps=ps.filter(p=>!sw.ga.includes(p.name)).concat(rosterOf(sw.b).filter(p=>sw.gb.includes(p.name)));
  else if(sw&&t===sw.b)ps=ps.filter(p=>!sw.gb.includes(p.name)).concat(rosterOf(sw.a).filter(p=>sw.ga.includes(p.name)));
  if(sw&&(t===sw.a||t===sw.b)&&ps.length!==n0){const k=new Set(t===sw.a?sw.gb:sw.ga);const r=settle(ps,n0,V||{},k);ps=r.ps;DROPS[t]={dr:r.dr,ad:r.ad}}
  L[t]=line(counted(ps))}return L}
function spread(L){const M={},SD={};for(const c of CATS){const v=T.map(t=>L[t][c]).filter(x=>x!=null);const m=v.reduce((a,b)=>a+b,0)/v.length;M[c]=m;SD[c]=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length)||1}return{M,SD}}
const rk=(L,t,c)=>1+T.filter(u=>u!==t&&L[u][c]!=null&&(LOW[c]?L[u][c]<L[t][c]:L[u][c]>L[t][c])).length;
const beats=(L,t)=>T.filter(u=>u!==t&&(r=>r.w>r.l)(vs(L[t],L[u]))).length;
const sg=c=>LOW[c]?-1:1;
function zDelta(b,a,sd,w){let s=0;for(const c of CATS){const k=w?(w[c]??1):1;if(!k||a[c]==null||b[c]==null)continue;s+=k*sg(c)*(a[c]-b[c])/sd[c]}return s}
function pval(){const all=T.flatMap(t=>rosterOf(t).map(p=>({p,t,s:pst(p)})));const M={},SD={};
  const att=(s,c)=>c==='FG%'?(+s.FGA||(+s.PTS||0)/2):(+s.FTA||(+s.PTS||0)/5);
  const raw=(s,c)=>{if(!PCT[c])return +s[c];if(s[c]==null)return NaN;return +s[c]*att(s,c)};
  const lg={};for(const c of CATS)if(PCT[c]){let W=0,X=0;all.forEach(x=>{if(x.s[c]!=null){const w=att(x.s,c);W+=w;X+=w*x.s[c]}});lg[c]=W?X/W:0}
  const imp=(s,c)=>PCT[c]?(s[c]==null?NaN:(+s[c]-lg[c])*att(s,c)):+s[c];
  for(const c of CATS){const v=all.map(x=>imp(x.s,c)).filter(x=>isFinite(x));const m=v.reduce((a,b)=>a+b,0)/(v.length||1);M[c]=m;SD[c]=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length||1))||1}
  const zf=s=>{let z=0;for(const c of CATS){const v=imp(s,c);if(isFinite(v))z+=sg(c)*(v-M[c])/SD[c]}return z};
  const V={};all.forEach(x=>{V[x.p.name]=zf(x.s)});
  FAP=(D.free_agents||[]).filter(p=>has(pst(p))&&!hurt(p)).map(p=>{V[p.name]=zf(pst(p));return p}).sort((x,y)=>V[y.name]-V[x.name]);return V}

function analyzer(){
  const a=ST[TS.a]?TS.a:D.standings[0].team, b=ST[TS.b]&&TS.b!==a?TS.b:T.find(t=>t!==a);TS.a=a;TS.b=b;

  const mine=counted(rosterOf(me)),out=[];
  const combos=a=>{const r=a.map(p=>[p]);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)r.push([a[i],a[j]]);return r};
  const myC=combos(mine);
  for(const u of T){if(u===me)continue;const theirs=counted(rosterOf(u)),thC=combos(theirs);
    const baseMe=mine,baseU=theirs;
    for(const g of myC)for(const r of thC){if(g.length===2&&r.length===2)continue;
      if(r.some(p=>stars.has(p.name))&&g.every(p=>PU.has(p.name)))continue;
      const gn=new Set(g.map(p=>p.name)),rn=new Set(r.map(p=>p.name));
      const nm1=line(counted(settle(rosterOf(me).filter(p=>!gn.has(p.name)).concat(r),rosterOf(me).length,V,rn).ps)),nu=line(counted(settle(rosterOf(u).filter(p=>!rn.has(p.name)).concat(g),rosterOf(u).length,V,gn).ps));
      const md=zDelta(B[me],nm1,SD,w),ud=zDelta(B[u],nu,SD);
      if(md<=0.15||ud<-0.3)continue;out.push({u,g:[...gn],r:[...rn],md,ud,nl:nm1})}}
  out.sort((x,y)=>(y.md+Math.min(0,y.ud))-(x.md+Math.min(0,x.ud)));
  const seen=new Set(),gc={},top=[];for(const o of out){const k=o.r.join('|'),gk=o.g.join('|');if(seen.has(k)||(gc[gk]||0)>=2||(gc['@'+o.u]||0)>=3)continue;seen.add(k);gc[gk]=(gc[gk]||0)+1;gc['@'+o.u]=(gc['@'+o.u]||0)+1;top.push(o);if(top.length>=15)break}
  TS.res={me,top,B};}

function rkAll(L){const r={},pts={};T.forEach(t=>{r[t]={};pts[t]=0});CATS.forEach(c=>T.forEach(t=>{r[t][c]=rk(L,t,c);pts[t]+=T.length+1-r[t][c]}));const pr={};[...T].sort((a,b)=>pts[b]-pts[a]).forEach((t,i)=>pr[t]=i+1);return{r,pr}}

  return `<div class="card" style="margin-top:18px"><h3>${title}</h3><p class="small mute" style="margin:4px 0 0">Same trade, two yardsticks: ESPN's season projections vs what players have actually averaged this season. Values are projected weekly totals after the trade; ranks are now → after among all 10 teams.${TS.inj?' Injured players counted.':' Injured players left out (tick “Count injured / IR players” above to include them).'}</p><div class="hstrip">${teams.map(card).join('')}</div></div>`}
function planRosters(){const R={};for(const t of T)R[t]=[...(D.rosters?.[t]||[])];const miss=[];
  for(const d of (TS.deals||[])){if(!R[d.a]||!R[d.b])continue;const outA=R[d.a].filter(p=>d.ga.includes(p.name)),outB=R[d.b].filter(p=>d.gb.includes(p.name));
    d.ga.concat(d.gb).forEach(n=>{if(!outA.concat(outB).some(p=>p.name===n))miss.push(n)});
    R[d.a]=R[d.a].filter(p=>!d.ga.includes(p.name)).concat(outB);R[d.b]=R[d.b].filter(p=>!d.gb.includes(p.name)).concat(outA)}
  R.__miss=miss;return R}
function linesOf(R){const L={};for(const t of T)L[t]=lineS(counted(R[t]||[]).map(pst));return L}

const CATN={PTS:'Points',REB:'Rebounds',AST:'Assists',STL:'Steals',BLK:'Blocks','3PM':'Threes','FG%':'FG%','FT%':'FT%',TO:'Turnovers'};
function dnaData(){
  const K=catBasis(),n=T.length;
  const out={};
  // per-player value inside the league (z-score sum over the 9 cats, same stat source as the toggle)
  const all=T.flatMap(t=>rosterOf(t).filter(p=>!hurt(p)).map(p=>({p,t,s:std(p)}))).filter(x=>x.s&&x.s.PTS!=null);
  const M={},SD={};CATS.forEach(c=>{const v=all.map(x=>x.s[c]).filter(x=>x!=null).map(x=>PCT[c]&&x>1?x/100:+x);const m=v.reduce((a,b)=>a+b,0)/(v.length||1);M[c]=m;SD[c]=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length||1))||1});

  const GL=D.games?.by_team||{};
  for(const t of T){

    const str=CATS.filter((c,i)=>R[i]<=3).sort((a,b)=>K.r(t,a)-K.r(t,b));
    const weak=CATS.filter((c,i)=>R[i]>=n-2).sort((a,b)=>K.r(t,b)-K.r(t,a));
    const r=c=>K.r(t,c),avg=R.reduce((a,b)=>a+b,0)/R.length;

    const bigs=(r('REB')+r('BLK')+r('FG%'))/3,guards=(r('3PM')+r('AST')+r('FT%')+r('STL'))/4;
    if(avg<=3.6&&Math.max(...R)<=n-3){arch='Complete contender';why='Top-tier almost everywhere. Hard to out-category.'}
    else if(r('FT%')>=n-2&&bigs<=4){arch='Paint bullies';why='Lives on boards, blocks and efficiency; lets FT% go.'}
    else if(guards<=4&&bigs>=n-3){arch='Small-ball guards';why='Threes, dimes, steals and free throws; gives up size.'}
    else if(r('TO')>=n-1&&(r('PTS')<=3||r('AST')<=3)){arch='High-usage scorers';why='Big counting stats from ball-dominant players, at the cost of turnovers.'}
    else if(r('TO')<=2&&r('PTS')>=n-3){arch='Careful low-usage';why='Rarely turns it over, but does not pile up volume.'}

}

   <div class="card rec"><span class="mute small">Season left</span><div class="big" style="font-size:26px;margin-top:4px">${left} week${left===1?'':'s'}</div><div class="small mute">Top ${po} of ${n} make the playoffs${clinch.length?` · locked in: ${clinch.map(nm).join(', ')}`:''}${out.length?` · eliminated: ${out.map(nm).join(', ')}`:''}</div></div></div>
  <div class="card" style="margin-top:18px"><h2>Playoff race</h2><div class="scroll"><table class="oddst"><thead><tr><th>#</th><th class="tl">Team</th><th>Proj. wins<div class="small mute">80% range</div></th><th>Playoffs</th><th>Top 2</th><th class="hide-sm">1st</th><th class="hide-sm">Last</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small mute">${N.toLocaleString()} simulated seasons. Wins include the current week. The line marks the playoff cut (top ${po}). Early in the season these move a lot.</p></div>
  <div class="card" style="margin-top:18px"><h2>Seed chances</h2><div class="scroll"><table class="seedt"><thead><tr><th class="tl">Team</th>${T.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr></thead><tbody>${seeds}</tbody></table></div><p class="small mute">Percent chance of finishing in each final standings spot. Darker = more likely.</p></div>`};
function oddsMini(){const S=oddsEnsure();if(!S)return `<p class="small mute">Simulating the season…</p>`;const {R,N}=S;
  return [...T].sort((a,b)=>R[b].po-R[a].po||R[b].wins-R[a].wins).map(t=>`<div class="omini">${tlink(t)}${obar(R[t].po,N)}</div>`).join('')+`<p class="small mute" style="margin-top:8px">Playoff chances · <a href="#odds">full season odds →</a></p>`}
let CB='roster';try{CB=localStorage.getItem('bg-cb2')||'roster'}catch(e){}
function stdLines(){const L={};for(const t of T)L[t]=lineS(rosterOf(t).filter(p=>!hurt(p)).map(std));return L}
function catBasis(){if(CB==='roster'){const L=stdLines();return{r:(t,c)=>rk(L,t,c),v:(t,c)=>f1(c,L[t][c]),note:`Projected weekly output: the average per-game stats of every active player (IR/OUT left out) × 10 players × 3.5 games, using ${TS.mode==='season'?'season averages (projection if under 3 games)':TS.mode==='recent'?'recent form':'ESPN projections — same as the War Room'}.`}}return{r:(t,c)=>RK[t][c],v:(t,c)=>fmt(c,AV[t][c]),note:'Actual results: average weekly totals from the games played so far'}}
function cbBar(){return `<div class="cbbar"><div class="seg" role="group" aria-label="Category basis"><button class="${CB==='season'?'on':''}" data-cb="season">Season so far</button><button class="${CB==='roster'?'on':''}" data-cb="roster">Current roster</button></div>${CB==='roster'?seg3():''}</div>`}
function seg3(){return `<div class="seg" role="group" aria-label="Player stats"><button class="${TS.mode==='proj'?'on':''}" data-tmode="proj">ESPN projections</button><button class="${TS.mode==='season'?'on':''}" data-tmode="season">Season so far</button><button class="${TS.mode==='recent'?'on':''}" data-tmode="recent">Recent form</button></div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-cb]');if(!el)return;CB=el.dataset.cb;try{localStorage.setItem('bg-cb2',CB)}catch(x){}route()});
const ord=n=>n==null?'–':n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

function rerank(){const K=catBasis();const pts={};for(const t of T)pts[t]=CATS.reduce((s,c)=>s+(T.length+1-K.r(t,c)),0);PW.sort((a,b)=>pts[b.t]-pts[a.t]||K.r(a.t,CATS[0])-K.r(b.t,CATS[0]));PW.forEach((p,i)=>{p.rank=i+1;p.pts=pts[p.t];PWR[p.t]=p})}
function route(){
  WORLD=null;try{rerank()}catch(e){console.error(e)}
  const h=location.hash.slice(1);
  if(h==='trades'&&(TS.deals||[]).length&&TS.sub!=='plan')WORLD=planRosters();const v=V[h]?h:'home';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));try{const on=document.querySelector('#nav a.on');if(on){const n=on.parentElement;n.scrollTo({left:on.offsetLeft-n.clientWidth/2+on.offsetWidth/2,behavior:'smooth'})}}catch(e){}
  $('#app').innerHTML=V[v]();
}
document.addEventListener('click',e=>{
  const q=k=>e.target.closest(`[data-${k}]`);let el;
  if(el=q('team')||q('pick')){team=el.dataset.team||el.dataset.pick;if(location.hash!=='#teams')location.hash='teams';else route();window.scrollTo({top:$('main').offsetTop-60})}
  else if(el=q('week')){wsel=+el.dataset.week;location.hash='matchups';route();$('main').scrollIntoView()}
  else if(el=q('wk')){wsel=+el.dataset.wk;route()}
  else if(el=q('mf')){mf=el.dataset.mf;route()}
});
addEventListener('hashchange',route);

const getData=()=>fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>fetch(LIVE,{cache:'no-store'}).then(r=>r.json()));
Promise.all([getData(),fetch('history.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])])
 .then(([d,h])=>{D=d;H=(Array.isArray(h)&&h.length)?h:((h&&h.seasons&&h.seasons.length)?h.seasons:(d.history||[]));build();hero();route()})
 .catch(e=>{$('#sub').textContent='Could not load league data.';console.error(e)});
}
