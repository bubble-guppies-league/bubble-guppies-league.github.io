<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bubble Guppies League</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly league clubhouse — playful name, serious numbers.
   IDEA: an aquarium scoreboard: the league lives in a tank, results float up like bubbles.
   PICTURE: deep-water hero band with rising bubbles holding this week's live scoreboard.
   COLOUR and TYPE: deep sea teal, aqua support, coral accent; Fredoka titles, Barlow figures.
   LAYOUT: sticky tab bar, one view at a time, cards in wrapping grids, tables scroll on phones. */
:root{color-scheme:light dark;--bg:light-dark(#eef8f7,#03161d);--card:light-dark(#fff,#08262f);--ink:light-dark(#07303a,#e4f6f4);--mute:light-dark(#4d6d75,#8db2b7);--line:light-dark(#d2e7e5,#14404b);--soft:light-dark(#e3f3f1,#0c323d);--sea1:#0b5a6b;--sea2:#04303d;--aqua:#35d8c6;--coral:#ff6f5e;--win:light-dark(#08867a,#3fe2cd);--loss:light-dark(#d9483a,#ff7d6d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:Fredoka,Barlow,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,3.4vw,32px);margin-bottom:14px}h3{font-size:19px}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,14px)}
.top{position:sticky;top:0;z-index:5;background:var(--sea2);color:#e8fbf9;box-shadow:0 2px 10px #0003}
.top .wrap{display:flex;align-items:center;gap:14px}
.brand{font:700 20px Fredoka,sans-serif;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:10px 0}
.brand svg{width:26px;height:26px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;flex:1}nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:#bfe9e4;text-decoration:none;padding:0 13px;min-height:48px;display:flex;align-items:center;font-weight:600;border-bottom:3px solid transparent}
nav a:hover{color:#fff}nav a.on{color:#fff;border-color:var(--aqua)}
nav a:focus-visible,.chip:focus-visible,.mc:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#147b8c 0%,var(--sea1) 40%,var(--sea2) 100%);color:#eafcfa;padding:clamp(26px,4vw,52px) 0 clamp(28px,4vw,48px)}
.hero h1{font-size:clamp(40px,7vw,72px);font-weight:700;letter-spacing:-.5px}
.hero .sub{color:#b7e6e1;margin:8px 0 22px;font-size:17px}
.bub{position:absolute;bottom:-40px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff9 0 12%,#9ff5ec33 30%,#5fe0d322 70%);border:1px solid #bff7f155;animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}
@media(prefers-reduced-motion:reduce){.bub{animation:none;display:none}}
.hero .wrap{position:relative}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.mc{background:#ffffff10;border:1px solid #ffffff22;border-radius:16px;padding:14px;cursor:pointer;backdrop-filter:blur(4px);text-align:left;width:100%}
.mc:hover{background:#ffffff1a}
.side{display:flex;align-items:center;gap:10px;padding:4px 0}
.side .n{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .rec{font-size:13px;opacity:.7;white-space:nowrap}
.side .sc{font:700 26px Fredoka,sans-serif;width:30px;text-align:right}
.side.lead .sc{color:var(--aqua)}
.pips{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:10px}
.pip{font-size:11px;text-align:center;border-radius:6px;padding:3px 0;background:#ffffff14;color:#cfeeea}
.pip.h{background:#35d8c655;color:#fff}.pip.a{background:#ff6f5e55;color:#fff}
.av{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px Fredoka,sans-serif;color:#fff;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.av.lg{width:64px;height:64px;font-size:22px}
main{padding:clamp(24px,3.5vw,44px) 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack2>*+*{margin-top:18px}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--mute);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,.tl{text-align:left}
tr.cut td{border-bottom:2px dashed var(--coral)}
.tn{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer}
.tn .av{width:28px;height:28px;font-size:11px}
.mute{color:var(--mute)}.small{font-size:13px}
.w{color:var(--win);font-weight:700}.l{color:var(--loss);font-weight:700}
.scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--sea1);border-color:var(--sea1);color:#fff}
.mx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;align-items:center}
.mx .c{font-size:13px;color:var(--mute);text-align:center;width:44px}
.mx .v{font-weight:600}.mx .v.r{text-align:right}
.mx .v.win{color:var(--win)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead .n{font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis}
.big{font:700 30px Fredoka,sans-serif}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sea1),var(--aqua))}
.brow{display:grid;grid-template-columns:48px minmax(0,1fr) 70px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.res{width:44px;border-radius:10px;padding:5px 0;text-align:center;font-size:12px;background:var(--soft)}
.res b{display:block;font:700 16px Fredoka,sans-serif}
.res.W b{color:var(--win)}.res.L b{color:var(--loss)}.res.live{outline:2px dashed var(--aqua)}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tag.add{background:light-dark(#d6f5f0,#0f4a45);color:var(--win)}.tag.drop{background:light-dark(#fde3df,#4a1c18);color:var(--loss)}.tag.trade{background:var(--coral);color:#fff}
.inj{font-size:11px;font-weight:700;color:#fff;background:var(--coral);border-radius:5px;padding:1px 5px;margin-left:6px}
.stat{display:flex;flex-direction:column}.stat b{font:700 28px Fredoka,sans-serif}.stat span{font-size:13px;color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:22px 34px;margin-top:14px}
.rec h3{margin-bottom:6px}.rec .big{color:var(--sea1)}
:root:not([data-theme=light]) .rec .big{color:light-dark(var(--sea1),var(--aqua))}
.heat td.h{border-radius:0}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.trophy{display:grid;place-items:center;gap:10px;padding:34px 16px;text-align:center}
.trophy svg{width:120px;height:120px}
.tbar{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.seg button{border:0;background:none;border-radius:999px;min-height:40px;padding:0 16px;font-weight:700;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--sea1);color:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;min-height:44px}.chk input{width:20px;height:20px;accent-color:var(--sea1)}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
select{font:600 16px Barlow,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:18px}
.grid2:first-child{margin-top:0}
.plist{margin-top:10px;max-height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;cursor:pointer;min-height:52px}
.pl.on{border-color:var(--aqua);background:color-mix(in srgb,var(--aqua) 16%,var(--card))}
.pl .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.pl.on .box{background:var(--sea1);border-color:var(--sea1)}
.pn{flex:1;display:flex;flex-direction:column}
.verdict{margin-top:18px}
.cw{flex-direction:column;gap:0;min-width:64px;justify-content:center}.cw .small{font-size:11px;line-height:1}
.cw.t{background:var(--sea1);border-color:var(--sea1);color:#fff}.cw.p{opacity:.55;text-decoration:line-through}
.idea .deal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.idea .deal div{display:flex;flex-direction:column}
.tchgs{display:flex;flex-wrap:wrap;gap:6px}.tchg{font-size:13px;background:var(--soft);border-radius:8px;padding:2px 8px}
.ideabot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.filters{display:grid;gap:12px;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr)}
@media(max-width:700px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .lab:first-child{grid-column:1/-1}}
input[type=search]{font:500 16px Barlow,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.sortb{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:6px 2px;min-height:36px}.sortb.on{color:var(--ink)}
.ptab td:first-child{display:flex;align-items:center;gap:10px;white-space:normal;min-width:210px}
.pcell{display:flex;flex-direction:column}
.pick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;cursor:pointer}
.pick.on{background:var(--sea1);border-color:var(--sea1);color:#fff}
tr.sel td{background:color-mix(in srgb,var(--aqua) 10%,transparent)}
.linkb{border:0;background:none;color:var(--win);font:inherit;font-weight:700;cursor:pointer;padding:4px;text-decoration:underline}
.cmph{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:normal}
td.best{color:var(--win);font-weight:800;background:color-mix(in srgb,var(--aqua) 14%,transparent)}
.vsrow{display:flex;align-items:center;justify-content:center;gap:22px}.vsc{text-align:center}
.cbbar{display:flex;flex-wrap:wrap;gap:8px 12px;margin:10px 0 8px}.seg.sm button{min-height:36px;padding:0 12px;font-size:14px}
.hstrip{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 10px;scroll-snap-type:x mandatory}
.pcard{flex:0 0 min(330px,86vw);scroll-snap-align:start}.pcard.mine{border:2px solid var(--aqua)}
.pw2{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}.pw2 b{font:700 20px Fredoka,sans-serif}
.ptbl td,.ptbl th{padding:6px 4px;font-size:14px}.pcard h4{margin:14px 0 6px;font-size:15px}
.rl{list-style:none;margin:0;padding:0;columns:2;column-gap:12px;font-size:14px}.rl li{padding:3px 0;break-inside:avoid}.rl .in{color:var(--win);font-weight:700}.rl .out{color:var(--loss);text-decoration:line-through}
.dealrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.dealrow span{flex:1;min-width:200px}
.planban{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;border-color:var(--aqua)}
footer{padding:24px 0 40px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:600px){table{font-size:13px}td,th{padding:8px 4px}.brand span{display:none}.hero .sub{font-size:15px}}
</style></head><body>
<header class="top"><div class="wrap">
<div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 16c4-7 12-9 18-4l6-5v18l-6-5c-6 5-14 3-18-4z" fill="#ff6f5e"/><circle cx="10" cy="14.5" r="1.8" fill="#04303d"/><circle cx="6" cy="6" r="2" fill="none" stroke="#35d8c6" stroke-width="1.5"/><circle cx="11" cy="3" r="1.2" fill="none" stroke="#35d8c6" stroke-width="1.2"/></svg><span>Bubble Guppies</span></div>
<nav id="nav"><a href="#home">Home</a><a href="#standings">Standings</a><a href="#matchups">Matchups</a><a href="#teams">Teams</a><a href="#players">Players</a><a href="#trades">Trades</a><a href="#moves">Moves</a><a href="#records">Records</a><a href="#champions">Champions</a></nav>
</div></header>
<section class="hero" id="hero"><div class="wrap">
<h1>Bubble Guppies</h1>
<p class="sub" id="sub">Loading the tank…</p>
<div class="grid" id="board"></div>
</div></section>
<main><div class="wrap" id="app"></div></main>
<footer id="foot">Bubble Guppies · ESPN fantasy basketball · 9-category head-to-head</footer>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=t=>esc(String(t??'').trim());
const LOW={TO:1},PCT={'FG%':1,'FT%':1};
const fmt=(c,v,d=0)=>v==null?'–':PCT[c]?(+v).toFixed(3).replace(/^0/,''):(+v).toFixed(d);
const pct=x=>isFinite(x)?x.toFixed(3).replace(/^0/,''):'–';
const HUES=[174,8,200,32,150,280,215,340,95,45,255,190];
let D,H=[],CATS,T,ST,G={},WK={},AP={},AV={},RK={},PW=[],PWR={},W,DONE=[],team=null,wsel=null,mf='all';
const hash=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
const av=(t,cls='')=>{const s=ST[t]||{};const ini=String(t).trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="av ${cls}" style="background:hsl(${HUES[Math.abs(hash(t))%HUES.length]} 55% 38%)">${esc(ini)}${(s.logo_data||s.logo)?`<img src="${esc(s.logo_data||s.logo)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`};
const rec=t=>{const s=ST[t];return s?`${s.wins}-${s.losses}${s.ties?'-'+s.ties:''}`:''};
const tlink=t=>`<span class="tn" data-team="${esc(t)}">${av(t)}${nm(t)}</span>`;
function vs(a,b){let w=0,l=0,t=0;for(const c of CATS){const x=a[c],y=b[c];if(x==null||y==null)continue;if(x===y)t++;else if(LOW[c]?x<y:x>y)w++;else l++}return{w,l,t}}

function build(){
  CATS=D.cats;W=D.week;T=D.standings.map(s=>s.team);ST=Object.fromEntries(D.standings.map(s=>[s.team,s]));
  T.forEach(t=>{G[t]=[];AP[t]={w:0,l:0,t:0,cw:0,cl:0,ct:0}});
  for(const m of D.matchups){
    for(const [me,op,s,o] of [[m.home,m.away,'home','away'],[m.away,m.home,'away','home']]){
      const st={},os={};for(const c of CATS){st[c]=m.cats?.[c]?.[s];os[c]=m.cats?.[c]?.[o]}
      const r=vs(st,os);G[me]?.push({week:m.week,opp:op,cw:r.w,cl:r.l,ct:r.t,res:r.w>r.l?'W':r.w<r.l?'L':'T',st,done:m.week<W});
      (WK[m.week]??={})[me]=st;
    }
  }
  DONE=Object.keys(WK).map(Number).filter(w=>w<W).sort((a,b)=>a-b);
  const use=DONE.length?DONE:Object.keys(WK).map(Number);
  for(const w of DONE){const ts=Object.keys(WK[w]);for(const a of ts)for(const b of ts){if(a===b)continue;const r=vs(WK[w][a],WK[w][b]);AP[a].cw+=r.w;AP[a].cl+=r.l;AP[a].ct+=r.t;if(r.w>r.l)AP[a].w++;else if(r.w<r.l)AP[a].l++;else AP[a].t++}}
  for(const t of T){AV[t]={};for(const c of CATS){const v=use.map(w=>WK[w]?.[t]?.[c]).filter(x=>x!=null);AV[t][c]=v.length?v.reduce((a,b)=>a+b,0)/v.length:null}}
  for(const c of CATS){const o=[...T].sort((a,b)=>LOW[c]?AV[a][c]-AV[b][c]:AV[b][c]-AV[a][c]);o.forEach((t,i)=>{(RK[t]??={})[c]=i+1})}
  PW=T.map(t=>{const g=G[t].filter(x=>x.done);let cw=0,cl=0,ct=0;g.forEach(x=>{cw+=x.cw;cl+=x.cl;ct+=x.ct});const a=AP[t];const apn=a.w+a.l+a.t,apP=apn?(a.w+a.t/2)/apn:0;const cn=cw+cl+ct,cP=cn?(cw+ct/2)/cn:0;const s=ST[t],n=s.wins+s.losses+s.ties,wP=n?(s.wins+s.ties/2)/n:0;
    let streak='';for(let i=g.length-1;i>=0;i--){if(!streak)streak=g[i].res+'1';else if(g[i].res===streak[0])streak=streak[0]+(+streak.slice(1)+1);else break}
    return{t,cw,cl,ct,cP,apP,wP,luck:wP-apP,streak,score:.5*apP+.3*cP+.2*wP}}).sort((a,b)=>b.score-a.score);
  PW.forEach((p,i)=>{p.rank=i+1;PWR[p.t]=p});
}

const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const weekGames=w=>D.matchups.filter(m=>m.week===w);

function hero(){
  const reg=D.settings?.reg_season_weeks||17;
  $('#sub').textContent=`2026–27 season · Week ${W} of ${reg} · ${T.length} teams · updated ${ago(D.updated)}`;
  $('#board').innerHTML=weekGames(W).map(m=>{const h=vs(cat(m,'home'),cat(m,'away'));
    const pips=CATS.map(c=>{const r=vs({[c]:m.cats?.[c]?.home},{[c]:m.cats?.[c]?.away});return `<span class="pip ${r.w?'h':r.l?'a':''}">${esc(c)}</span>`}).join('');
    return `<button class="mc" data-week="${m.week}"><div class="side ${h.w>h.l?'lead':''}">${av(m.home)}<span class="n">${nm(m.home)}</span><span class="rec">${rec(m.home)}</span><span class="sc">${h.w}</span></div><div class="side ${h.l>h.w?'lead':''}">${av(m.away)}<span class="n">${nm(m.away)}</span><span class="rec">${rec(m.away)}</span><span class="sc">${h.l}</span></div><div class="pips">${pips}</div></button>`}).join('');
  const hr=$('#hero');for(let i=0;i<14;i++){const b=document.createElement('span');const s=6+Math.random()*22;b.className='bub';b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*20}s`;hr.prepend(b)}
}
const cat=(m,s)=>Object.fromEntries(CATS.map(c=>[c,m.cats?.[c]?.[s]]));

function standTable(full){
  const po=D.settings?.playoff_teams||6;
  const rows=D.standings.map((s,i)=>{const p=PWR[s.team],a=AP[s.team];const n=s.wins+s.losses+s.ties;

    return `<button class="pl ${on?'on':''}" data-tp="${key}" data-n="${esc(p.name)}"><span class="box">${on?'✓':''}</span><span class="pn"><span><b>${esc(p.name)}</b>${hurt(p)||p.injury!=='ACTIVE'?`<span class="inj">${esc(String(p.injury).replace('DAY_TO_DAY','DTD'))}</span>`:''}${PU.has(p.name)?'<span class="tag add" style="margin-left:6px">pickup</span>':''}</span><span class="small mute">${esc(p.team)} · ${f1('PTS',s.PTS)} pts · ${f1('REB',s.REB)} reb · ${f1('AST',s.AST)} ast</span></span><span class="small mute">${(V[p.name]||0).toFixed(1)}</span></button>`}).join('')};
  let res='';
  if(TS.ga.length||TS.gb.length){const B=lines(),A=lines({a,b,ga:TS.ga,gb:TS.gb},V);const DR=DROPS;const {SD}=spread(B);
    const card=(t,gv,gt)=>{const zd=zDelta(B[t],A[t],SD);const b0=beats(B,t),b1=beats(A,t);
      const rows=CATS.map(c=>{const r0=rk(B,t,c),r1=rk(A,t,c);return `<tr><td>${esc(c)}</td><td>${f1(c,B[t][c])}</td><td>${f1(c,A[t][c])}</td><td>${dl(c,A[t][c]-B[t][c])}</td><td>${r0===r1?ord(r0):`${ord(r0)} → <b class="${r1<r0?'w':'l'}">${ord(r1)}</b>`}</td></tr>`}).join('');
      return `<div class="card"><div class="mhead">${av(t)}<span class="n">${nm(t)}</span><span class="big ${zd>0.05?'w':zd<-0.05?'l':''}" style="font-size:24px">${zd>0?'+':''}${zd.toFixed(2)}</span></div>
      <p class="small mute" style="margin:0 0 8px">Gives ${plist(gv)} · gets ${plist(gt)}${DR[t]?.dr?.length?` · <b>drops ${plist(DR[t].dr)}</b> (lowest value)`:''}${DR[t]?.ad?.length?` · <b>adds ${plist(DR[t].ad)}</b> (best free agent)`:''}<br>Would beat <b>${b0}</b> → <b class="${b1>b0?'w':b1<b0?'l':''}">${b1}</b> of ${T.length-1} teams head-to-head</p>
      <div class="scroll"><table><thead><tr><th>Cat</th><th>Now</th><th>After</th><th>Change</th><th>League rank</th></tr></thead><tbody>${rows}</tbody></table></div></div>`};
    const za=zDelta(B[a],A[a],SD),zb=zDelta(B[b],A[b],SD);const diff=za-zb;
    const verdict=Math.abs(diff)<0.35?'Pretty even trade.':`Leans toward <b>${nm(diff>0?a:b)}</b>.`;
    const ra='Rosters stay the same size: whoever gets an extra player drops their weakest, whoever is left short picks up the best free agent';
    res=`<div class="card verdict"><h3>${verdict}</h3><p class="small mute" style="margin:6px 0 0">Score = change in team strength across all 9 categories, in league standard deviations. ${ra}.</p><div class="chips" style="margin:12px 0 0"><button class="chip on" data-tsave>Add to my plan</button><button class="chip" data-tclear>Clear picks</button></div></div><div class="grid2">${card(a,TS.ga,TS.gb)}${card(b,TS.gb,TS.ga)}</div>`}
  return `${banner}<div class="grid2"><div class="card"><label class="lab">Team A<select id="ta">${opt(a,b)}</select></label><div class="plist">${side(a,'ga')}</div></div><div class="card"><label class="lab">Team B<select id="tb">${opt(b,a)}</select></label><div class="plist">${side(b,'gb')}</div></div></div><p class="small mute">Tap players to put them in the deal. Number on the right is the player's overall value across the 9 categories.</p>${res||'<div class="card empty">Pick players from either side to see the trade breakdown.</div>'}`}

function runFinder(){
  const me=TS.me,w=Object.fromEntries(CATS.map(c=>[c,TS.w[c]==='t'?2:TS.w[c]==='p'?0:1]));
  const B=lines(),{SD}=spread(B),V=pval(),PU=pickups();
  const stars=new Set(Object.entries(V).sort((x,y)=>y[1]-x[1]).slice(0,30).map(x=>x[0]));
  const mine=counted(rosterOf(me)),out=[];
  const combos=a=>{const r=a.map(p=>[p]);for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)r.push([a[i],a[j]]);return r};
  const myC=combos(mine);
  for(const u of T){if(u===me)continue;const theirs=counted(rosterOf(u)),thC=combos(theirs);
    const baseMe=mine,baseU=theirs;
    for(const g of myC)for(const r of thC){if(g.length===2&&r.length===2)continue;
      if(r.some(p=>stars.has(p.name))&&g.every(p=>PU.has(p.name)))continue;
      const gn=new Set(g.map(p=>p.name)),rn=new Set(r.map(p=>p.name));
      const nm1=line(counted(settle(rosterOf(me).filter(p=>!gn.has(p.name)).concat(r),rosterOf(me).length,V,rn).ps)),nu=line(counted(settle(rosterOf(u).filter(p=>!rn.has(p.name)).concat(g),rosterOf(u).length,V,gn).ps));
      const md=zDelta(B[me],nm1,SD,w),ud=zDelta(B[u],nu,SD);
      if(md<=0.15||ud<-0.3)continue;out.push({u,g:[...gn],r:[...rn],md,ud,nl:nm1})}}
  out.sort((x,y)=>(y.md+Math.min(0,y.ud))-(x.md+Math.min(0,x.ud)));
  const seen=new Set(),gc={},top=[];for(const o of out){const k=o.r.join('|'),gk=o.g.join('|');if(seen.has(k)||(gc[gk]||0)>=2||(gc['@'+o.u]||0)>=3)continue;seen.add(k);gc[gk]=(gc[gk]||0)+1;gc['@'+o.u]=(gc['@'+o.u]||0)+1;top.push(o);if(top.length>=15)break}
  TS.res={me,top,B};}

function finder(){
  const me=ST[TS.me]?TS.me:(ST['Khadracadabra']?'Khadracadabra':D.standings[0].team);TS.me=me;
  const opt=T.map(t=>`<option value="${esc(t)}" ${t===me?'selected':''}>${nm(t)}</option>`).join('');
  const cc=CATS.map(c=>{const s=TS.w[c]||'n';return `<button class="chip cw ${s}" data-tw="${esc(c)}">${esc(c)}<span class="small">${s==='t'?'target':s==='p'?'punt':''}</span></button>`}).join('');
  let res='';
  if(TS.res&&TS.res.me===me){const {top,B}=TS.res;
    res=top.length?top.map((o,i)=>{const ch=CATS.map(c=>({c,d:o.nl[c]-B[me][c]})).filter(x=>Math.abs(x.d)>(PCT[x.c]?.002:.3)).sort((x,y)=>sg(y.c)*y.d-sg(x.c)*x.d).slice(0,5).map(x=>`<span class="tchg">${esc(x.c)} ${dl(x.c,x.d)}</span>`).join('');
      return `<div class="card idea"><div class="small mute">with ${nm(o.u)}</div><div class="deal"><div><span class="small mute">You give</span><b>${plist(o.g)}</b></div><div><span class="small mute">You get</span><b>${plist(o.r)}</b></div></div><div class="tchgs">${ch}</div><div class="ideabot"><span class="small">You <b class="w">+${o.md.toFixed(2)}</b> · them <b class="${o.ud>=0?'w':'l'}">${o.ud>=0?'+':''}${o.ud.toFixed(2)}</b></span><button class="chip" data-tan="${i}">Open in analyzer</button></div></div>`}).join(''):'<div class="card empty">No trades found that help you without hurting the other team much. Try targeting fewer categories.</div>';
    res=`<div class="grid">${res}</div>`}
  return `<div class="card"><label class="lab">Your team<select id="tme">${opt}</select></label><p class="small mute" style="margin:12px 0 6px">Tap a category to cycle: normal → <b>target</b> (counts double) → <b>punt</b> (ignored).</p><div class="chips">${cc}</div><button class="chip on" data-tfind style="width:100%;justify-content:center">Find trades</button><p class="small mute" style="margin:10px 0 0">Scans every 1-for-1, 2-for-1 and 1-for-2 deal with every team (whoever gets the extra player drops their weakest; whoever is left short picks up the best free agent). It only shows deals that also keep the other team roughly even, and skips star-for-pickups deals nobody would accept.</p></div><div style="margin-top:18px">${res}</div>`}

function planRosters(){const R={};for(const t of T)R[t]=[...(D.rosters?.[t]||[])];const miss=[];
  for(const d of (TS.deals||[])){if(!R[d.a]||!R[d.b])continue;const outA=R[d.a].filter(p=>d.ga.includes(p.name)),outB=R[d.b].filter(p=>d.gb.includes(p.name));
    d.ga.concat(d.gb).forEach(n=>{if(!outA.concat(outB).some(p=>p.name===n))miss.push(n)});
    R[d.a]=R[d.a].filter(p=>!d.ga.includes(p.name)).concat(outB);R[d.b]=R[d.b].filter(p=>!d.gb.includes(p.name)).concat(outA)}
  R.__miss=miss;return R}
function linesOf(R){const L={};for(const t of T)L[t]=lineS(counted(R[t]||[]).map(pst));return L}

    return `<div class="card pcard ${t===me?'mine':''}"><div class="mhead">${av(t)}<span class="n">${nm(t)}${t===me?' <span class="tag add">you</span>':''}</span></div>
    <div class="pw2"><span>Power</span><b>#${PR0[t]}</b>→<b class="${PR1[t]<PR0[t]?'w':PR1[t]>PR0[t]?'l':''}">#${PR1[t]}</b><span class="small mute">${P0[t]}→${P1[t]} pts</span></div>
    <table class="ptbl"><thead><tr><th class="tl">Cat</th><th>Now</th><th>After</th><th>Rank</th></tr></thead><tbody>${rows}</tbody></table>
    <h4>Roster after (${n1}${n1!==n0?`, was ${n0}`:''})</h4>${n1>n0?`<p class="small l" style="margin:0 0 6px">Needs to drop ${n1-n0} player${n1-n0>1?'s':''}</p>`:n1<n0?`<p class="small w" style="margin:0 0 6px">${n0-n1} open roster spot${n0-n1>1?'s':''}</p>`:''}
    <ul class="rl">${ins.map(p=>`<li class="in">+ ${esc(p.name)}</li>`).join('')}${outs.map(p=>`<li class="out">− ${esc(p.name)}</li>`).join('')}${kept}</ul></div>`};
  const list=deals.map((d,i)=>`<div class="dealrow"><b>${i+1}.</b><span>${nm(d.a)} ⇄ ${nm(d.b)}<br>${nm(d.a)} gets <b>${plist(d.gb)}</b> · ${nm(d.b)} gets <b>${plist(d.ga)}</b></span><button class="chip" data-tdel="${i}">Remove</button></div>`).join('');
  const opt=T.map(t=>`<option value="${esc(t)}" ${t===me?'selected':''}>${nm(t)}</option>`).join('');
  return `<div class="card"><h3>Your plan · ${deals.length} deal${deals.length>1?'s':''}, applied in order</h3>${list}${R1.__miss.length?`<p class="small l">Not on that roster anymore (skipped): ${plist(R1.__miss)}</p>`:''}<div class="chips" style="margin:12px 0 0"><button class="chip" data-tclearplan>Clear plan</button></div></div>
  <div class="card" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:end"><label class="lab" style="min-width:220px">My team<select id="tme">${opt}</select></label><label class="chk"><input type="checkbox" data-tplanall ${TS.planAll?'checked':''}> Show all teams</label><span class="small mute">Projected week per team (same method as the War Room). Swipe sideways to see every team.</span></div>
  <div class="hstrip">${show.map(card).join('')}</div>`}
V.trades=()=>`<h2>Trades</h2>${tradeHead()}<div style="margin-top:18px">${TS.sub==='find'?finder():TS.sub==='plan'?planView():analyzer()}</div>`;

document.addEventListener('click',e=>{const q=k=>e.target.closest(`[data-${k}]`);let el;

try{Object.assign(PS,JSON.parse(localStorage.getItem('bg-players')||'{}'));PS.lim=60}catch(e){}

function allP(){const r=[];for(const t of T)for(const p of rosterOf(t))r.push({p,o:t});for(const p of (D.free_agents||[]))r.push({p,o:null});return r}
const POS=['PG','SG','SF','PF','C'];
function modeBar(team){return `<div class="card tbar"><div class="seg" role="group" aria-label="Player stats"><button class="${TS.mode==='proj'?'on':''}" data-tmode="proj">ESPN projections</button><button class="${TS.mode==='season'?'on':''}" data-tmode="season">Season so far</button><button class="${TS.mode==='recent'?'on':''}" data-tmode="recent">Recent form</button></div>${team?`<label class="chk"><input type="checkbox" data-tinj ${TS.inj?'checked':''}> Count injured / IR players</label>`:''}<span class="small mute">ESPN projections = what the War Room uses (default). Season so far = actual averages this season. Recent form = last ~15 days.</span></div>`}
function prows(){const V=pval(),q=PS.q.trim().toLowerCase();
  let R=allP().filter(x=>(PS.team==='all'||(PS.team==='fa'?!x.o:x.o===PS.team))&&(PS.pos==='all'||(x.p.elig||[x.p.pos]).includes(PS.pos))&&(!q||x.p.name.toLowerCase().includes(q)||String(x.p.team).toLowerCase()===q));

function ptable(){const R=prows();const cols=[['name','Player'],['gp','GP'],...CATS.map(c=>[c,c]),['val','Value']];
  const th=cols.map(([k,l])=>`<th class="${k==='name'?'tl':''}"><button class="sortb ${PS.sort===k?'on':''}" data-psort="${esc(k)}">${esc(l)}${PS.sort===k?(PS.dir<0?' ▾':' ▴'):''}</button></th>`).join('');

  return `<p class="small mute" style="margin:0 0 8px">${R.length} players${PS.sel.length?` · <b>${PS.sel.length} picked to compare</b> <button class="linkb" data-psub="cmp">Compare now →</button> <button class="linkb" data-pclr>clear</button>`:' · tap + on up to 4 players to compare'}</p><div class="scroll"><table class="ptab"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table></div>${R.length>PS.lim?`<button class="chip" data-pmore style="margin-top:12px;width:100%;justify-content:center">Show more (${R.length-PS.lim} left)</button>`:''}`}
function plistView(){
  const topt=`<option value="all">All players</option><option value="fa" ${PS.team==='fa'?'selected':''}>Free agents</option>${T.map(t=>`<option value="${esc(t)}" ${PS.team===t?'selected':''}>${nm(t)}</option>`).join('')}`;

  return `<div class="card"><div class="filters"><label class="lab">Search<input id="pq" type="search" placeholder="Player or NBA team (e.g. LAL)" value="${esc(PS.q)}" autocomplete="off"></label><label class="lab">Team<select id="pteam">${topt}</select></label><label class="lab">Position<select id="ppos">${popt}</select></label></div><div id="ptable" style="margin-top:14px">${ptable()}</div><p class="small mute">Value = overall worth across the 9 categories (FG%/FT% weighted by shot volume). Tap a column to sort.</p></div>`}
function pcmp(){const V=pval();const P=PS.sel.map(n=>allP().find(x=>x.p.name===n)).filter(Boolean);
  if(!P.length)return `<div class="card empty">Pick up to 4 players on the Players list (tap +) to compare them here.</div>`;
  const S=P.map(x=>pst(x.p));
  const best=c=>{const v=S.map(s=>+s[c]).filter(isFinite);if(!v.length)return null;return LOW[c]?Math.min(...v):Math.max(...v)};
  const head=P.map(x=>`<th><div class="cmph"><b>${esc(x.p.name)}</b><span class="small mute">${esc(x.p.team)} · ${x.o?nm(x.o):'Free agent'}</span><button class="linkb" data-psel="${esc(x.p.name)}">remove</button></div></th>`).join('');
  const rows=CATS.map(c=>{const b=best(c);return `<tr><td>${esc(c)}</td>${S.map(s=>`<td class="${b!=null&&+s[c]===b&&P.length>1?'best':''}">${f1(c,s[c])}</td>`).join('')}</tr>`}).join('');
  const vals=P.map(x=>V[x.p.name]??0),bv=Math.max(...vals);
  const extra=`<tr><td>Games</td>${P.map(x=>`<td>${x.p.season?.GP??'–'}</td>`).join('')}</tr><tr><td>Shots</td>${S.map(s=>`<td class="small">${s.FGA!=null?`${(+s.FGM).toFixed(1)}/${(+s.FGA).toFixed(1)} FG<br>${(+s.FTM).toFixed(1)}/${(+s.FTA).toFixed(1)} FT`:'–'}</td>`).join('')}</tr><tr><td><b>Value</b></td>${vals.map(v=>`<td class="${v===bv&&P.length>1?'best':''}"><b>${v.toFixed(2)}</b></td>`).join('')}</tr>`;
  return `<div class="card"><div class="scroll"><table class="cmpt"><thead><tr><th class="tl">Per game</th>${head}</tr></thead><tbody>${rows}${extra}</tbody></table></div><p class="small mute">Highlighted = best of the group (fewest for TO).</p></div>`}
function tcmp(){const a=ST[PS.ca]?PS.ca:D.standings[0].team,b=ST[PS.cb]&&PS.cb!==a?PS.cb:T.find(t=>t!==a);PS.ca=a;PS.cb=b;
  const L=lines(),r=vs(L[a],L[b]),act=vs(AV[a],AV[b]);
  const opt=(s,ex)=>T.filter(t=>t!==ex).map(t=>`<option value="${esc(t)}" ${t===s?'selected':''}>${nm(t)}</option>`).join('');
  const cell=(c,x,y)=>{const w=x!=null&&y!=null&&x!==y&&(LOW[c]?x<y:x>y);return `<td class="${w?'best':''}">${f1(c,x)}</td>`};
  const rows=CATS.map(c=>`<tr><td>${esc(c)}</td>${cell(c,L[a][c],L[b][c])}${cell(c,L[b][c],L[a][c])}<td class="mute">${fmt(c,AV[a][c])}</td><td class="mute">${fmt(c,AV[b][c])}</td><td>${rk(L,a,c)} / ${rk(L,b,c)}</td></tr>`).join('');
  const h2h=G[a].filter(g=>g.opp===b).map(g=>`<span class="tchg">W${g.week}: ${g.cw}-${g.cl}${g.done?'':' (live)'}</span>`).join('');
  return `<div class="grid2"><div class="card"><label class="lab">Team A<select id="pca">${opt(a,b)}</select></label></div><div class="card"><label class="lab">Team B<select id="pcb">${opt(b,a)}</select></label></div></div>
  <div class="card" style="margin-top:18px"><div class="vsrow">${av(a,'lg')}<div class="vsc"><div class="big">${r.w} – ${r.l}</div><div class="small mute">projected categories${r.t?`, ${r.t} tied`:''}</div></div>${av(b,'lg')}</div>
  <p class="small mute" style="text-align:center;margin:6px 0 14px">Projected week from every player's averages (same method as the War Room). Actual weekly averages so far: ${act.w}-${act.l}${act.t?'-'+act.t:''}.${h2h?'<br>Head-to-head this season: ':''}</p>${h2h?`<div class="tchgs" style="justify-content:center;margin-bottom:12px">${h2h}</div>`:''}
  <div class="scroll"><table><thead><tr><th class="tl">Cat</th><th>${nm(a)}<br><span class="mute small">roster/week</span></th><th>${nm(b)}<br><span class="mute small">roster/week</span></th><th>${nm(a)}<br><span class="mute small">avg week</span></th><th>${nm(b)}<br><span class="mute small">avg week</span></th><th>Rank A / B</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
V.players=()=>`<h2>Players &amp; compare</h2><div class="chips" style="margin-bottom:10px"><button class="chip ${PS.sub==='list'?'on':''}" data-psub="list">Players</button><button class="chip ${PS.sub==='cmp'?'on':''}" data-psub="cmp">Compare players${PS.sel.length?` (${PS.sel.length})`:''}</button><button class="chip ${PS.sub==='teams'?'on':''}" data-psub="teams">Team vs team</button></div>${modeBar(PS.sub==='teams')}<div style="margin-top:18px">${PS.sub==='cmp'?pcmp():PS.sub==='teams'?tcmp():plistView()}</div>`;
document.addEventListener('click',e=>{const q=k=>e.target.closest(`[data-${k}]`);let el;
  if(el=q('psub'))PS.sub=el.dataset.psub;
  else if(el=q('psort')){const k=el.dataset.psort;if(PS.sort===k)PS.dir*=-1;else{PS.sort=k;PS.dir=(k==='name'||k==='TO')?1:-1}}
  else if(el=q('psel')){const n=el.dataset.psel;PS.sel=PS.sel.includes(n)?PS.sel.filter(x=>x!==n):[...PS.sel,n].slice(-4)}
  else if(q('pmore'))PS.lim+=60;
  else if(q('pclr'))PS.sel=[];
  else return;
  psave();if(PS.sub==='list'&&document.getElementById('ptable')&&!q('psub')){document.getElementById('ptable').innerHTML=ptable()}else route()});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='pteam')PS.team=e.target.value;else if(id==='ppos')PS.pos=e.target.value;else if(id==='pca')PS.ca=e.target.value;else if(id==='pcb')PS.cb=e.target.value;else return;PS.lim=60;psave();route()});
document.addEventListener('input',e=>{if(e.target.id!=='pq')return;PS.q=e.target.value;PS.lim=60;psave();const t=document.getElementById('ptable');if(t)t.innerHTML=ptable()});

let CB='roster';try{CB=localStorage.getItem('bg-cb2')||'roster'}catch(e){}
function stdLines(){const L={};for(const t of T)L[t]=lineS(rosterOf(t).filter(p=>!hurt(p)).map(std));return L}
function catBasis(){if(CB==='roster'){const L=stdLines();return{r:(t,c)=>rk(L,t,c),v:(t,c)=>f1(c,L[t][c]),note:`Projected weekly output: the average per-game stats of every active player (IR/OUT left out) × 10 players × 3.5 games, using ${TS.mode==='season'?'season averages (projection if under 3 games)':TS.mode==='recent'?'recent form':'ESPN projections — same as the War Room'}.`}}return{r:(t,c)=>RK[t][c],v:(t,c)=>fmt(c,AV[t][c]),note:'Actual results: average weekly totals from the games played so far'}}
function cbBar(){return `<div class="cbbar"><div class="seg" role="group" aria-label="Category basis"><button class="${CB==='season'?'on':''}" data-cb="season">Season so far</button><button class="${CB==='roster'?'on':''}" data-cb="roster">Current roster</button></div>${CB==='roster'?seg3():''}</div>`}
function seg3(){return `<div class="seg" role="group" aria-label="Player stats"><button class="${TS.mode==='proj'?'on':''}" data-tmode="proj">ESPN projections</button><button class="${TS.mode==='season'?'on':''}" data-tmode="season">Season so far</button><button class="${TS.mode==='recent'?'on':''}" data-tmode="recent">Recent form</button></div>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-cb]');if(!el)return;CB=el.dataset.cb;try{localStorage.setItem('bg-cb2',CB)}catch(x){}route()});
const ord=n=>n==null?'–':n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');

function rerank(){const K=catBasis();const pts={};for(const t of T)pts[t]=CATS.reduce((s,c)=>s+(T.length+1-K.r(t,c)),0);PW.sort((a,b)=>pts[b.t]-pts[a.t]||K.r(a.t,CATS[0])-K.r(b.t,CATS[0]));PW.forEach((p,i)=>{p.rank=i+1;p.pts=pts[p.t];PWR[p.t]=p})}
function route(){
  WORLD=null;try{rerank()}catch(e){console.error(e)}
  const h=location.hash.slice(1);
  if(h==='trades'&&(TS.deals||[]).length&&TS.sub!=='plan')WORLD=planRosters();const v=V[h]?h:'home';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
  $('#app').innerHTML=V[v]();
}
document.addEventListener('click',e=>{
  const q=k=>e.target.closest(`[data-${k}]`);let el;
  if(el=q('team')||q('pick')){team=el.dataset.team||el.dataset.pick;if(location.hash!=='#teams')location.hash='teams';else route();window.scrollTo({top:$('main').offsetTop-60})}
  else if(el=q('week')){wsel=+el.dataset.week;location.hash='matchups';route();$('main').scrollIntoView()}
  else if(el=q('wk')){wsel=+el.dataset.wk;route()}
  else if(el=q('mf')){mf=el.dataset.mf;route()}
});
addEventListener('hashchange',route);
const LIVE='https://khadranero.github.io/war-room/data.json';
const getData=()=>fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>fetch(LIVE,{cache:'no-store'}).then(r=>r.json()));
Promise.all([getData(),fetch('history.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])])
 .then(([d,h])=>{D=d;H=Array.isArray(h)?h:(h.seasons||[]);build();hero();route()})
 .catch(e=>{$('#sub').textContent='Could not load league data.';console.error(e)});
}
</script></body></html>
